[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memturn"
version = "0.2.0"
description = "Bounded memory consolidation and selective internalization for continual agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = ["psutil>=5.9,<8"]

[tool.setuptools.packages.find]
where = ["src"]
